[build-system]
requires = ["setuptools>=84.2.1,<85", "wheel>=0.48.0,<0.49"]
build-backend = "setuptools.build_meta"

[project]
name = "finchvox-livekit-example"
version = "0.1.0"
description = "LiveKit agent example with Finchvox telemetry"
requires-python = ">=3.12,<3.15"

dependencies = [
    "python-dotenv>=1.2.4,<2",
    "finchvox[livekit]",
]

[tool.uv.sources]
finchvox = { path = "../..", editable = true }
[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.17.2,<0.18",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
